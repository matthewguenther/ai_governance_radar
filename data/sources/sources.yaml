# Source registry (§85 shape). Loaded idempotently by `radar seed`.
# tier: 1 primary authoritative · 2 high-quality secondary · 3 professional reporting · 4 community
# Feed URLs verified by live fetch during T-007 (see SOURCE_CATALOG.md for status).

- name: NIST News
  url: https://www.nist.gov/news-events/news
  feed_url: https://www.nist.gov/news-events/news/rss.xml
  type: rss
  tier: 1
  jurisdiction: US
  category: standard
  polling_interval_minutes: 360
  enabled: true

# CISA blocks non-browser clients (HTTP 403 as of 2026-08-11 verification). We use an
# honest User-Agent and do not spoof browsers. Disabled by default; enable if CISA
# allows programmatic access again.
- name: CISA Advisories
  url: https://www.cisa.gov/news-events/cybersecurity-advisories
  feed_url: https://www.cisa.gov/cybersecurity-advisories/all.xml
  type: rss
  tier: 1
  jurisdiction: US
  category: security
  polling_interval_minutes: 360
  enabled: false

- name: Federal Register — Artificial Intelligence
  url: https://www.federalregister.gov/
  feed_url: https://www.federalregister.gov/api/v1/documents.json?conditions%5Bterm%5D=artificial+intelligence&per_page=20&order=newest
  type: json_api
  tier: 1
  jurisdiction: US
  category: regulation
  polling_interval_minutes: 720
  enabled: true
  config:
    mapping:
      items_path: results
      url: html_url
      title: title
      summary: abstract
      published: publication_date
  attribution: "Federal Register data is in the public domain."

- name: GOV.UK — AI announcements
  url: https://www.gov.uk/search/news-and-communications?keywords=artificial%20intelligence
  feed_url: https://www.gov.uk/search/news-and-communications.atom?keywords=artificial%20intelligence&order=updated-newest
  type: atom
  tier: 1
  jurisdiction: GB
  category: regulation
  polling_interval_minutes: 720
  enabled: true
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0."
  config:
    # GOV.UK's site-wide search returns unrelated government news; require
    # AI-specific subject matter before an item enters the radar.
    require_ai_relevance: true

# --- Incidents -------------------------------------------------------------
- name: AI Incident Database
  url: https://incidentdatabase.ai/
  feed_url: https://incidentdatabase.ai/rss.xml
  type: rss
  tier: 2
  category: incident
  polling_interval_minutes: 360
  enabled: true
  attribution: "AI Incident Database (Responsible AI Collaborative), CC BY-SA."

# --- AI governance / policy press (Tier 3) ---------------------------------
- name: The Register — AI/ML
  url: https://www.theregister.com/software/ai_ml/
  feed_url: https://www.theregister.com/software/ai_ml/headlines.atom
  type: atom
  tier: 3
  category: news
  polling_interval_minutes: 360
  enabled: true

- name: MIT Technology Review — AI
  url: https://www.technologyreview.com/topic/artificial-intelligence/
  feed_url: https://www.technologyreview.com/topic/artificial-intelligence/feed/
  type: rss
  tier: 3
  category: news
  polling_interval_minutes: 720
  enabled: true

- name: TechCrunch — AI
  url: https://techcrunch.com/category/artificial-intelligence/
  feed_url: https://techcrunch.com/category/artificial-intelligence/feed/
  type: rss
  tier: 3
  category: news
  polling_interval_minutes: 720
  enabled: true
  config:
    require_ai_relevance: true

# --- Events & professional development --------------------------------------
- name: arXiv — LLM/AI security research
  url: https://arxiv.org/list/cs.CR/recent
  feed_url: https://export.arxiv.org/api/query?search_query=cat:cs.CR+AND+%28all:%22prompt+injection%22+OR+all:%22LLM+security%22+OR+all:%22jailbreak%22%29&sortBy=submittedDate&sortOrder=descending&max_results=20
  type: atom
  tier: 2
  category: research
  polling_interval_minutes: 720
  enabled: true
  attribution: "Thank you to arXiv for use of its open access interoperability."

